apiVersion: v1
metadata:
  name: awesome-rayfin
  displayName: Awesome Rayfin Templates
  description: Community-curated template gallery for Project Rayfin
entries:
  - path: templates/angular-blankapp
    name: Angular Blank App
    description: Bare-bones Fabric-authenticated Angular + Material app — sign-in, routing, and a placeholder home page, with no data layer to remove
  - path: templates/angular-dashboard
    name: Angular Dashboard App
    description: Responsive Angular Material dashboard — top navbar + collapsible side menu, Project/Task data model, and optional one-click GitHub Issues/PRs sync for a public repo.
  - path: templates/field-technician
    name: Field Technician App
    description: Field service management app with role-based dashboards for dispatchers and technicians, job tracking, customer lookup, and dual-mode auth (local password + Fabric)
  - path: templates/helsinki-public-transport
    name: Helsinki Public Transport
    description: Live public transport over a Fabric Real-Time Intelligence Eventhouse - a DirectQuery semantic model queried straight from the browser, drawn on a 2D map and on a token-free 3D city twin built from open geodata
  - path: templates/ibcs-trainer
    name: IBCS Trainer
    description: HTML5 Canvas platformer that teaches IBCS chart rules level by level, embedded in a Fabric-authenticated Rayfin app; each play-through is persisted to a typed GameStats entity
  - path: templates/maritime-insights
    name: Maritime Insights
    description: Interactive 3D coastal twin of the Kiel Fjord, built entirely from open geodata — true-scale DGM1 terrain with LoD2 buildings and an orthophoto drape, a coarse Copernicus DEM shell for the horizon, and a geometric sensor-visibility model that is explicitly not a radar model.
  - path: templates/pbi-fixer
    name: Power BI Fixer
    description: Fabric-authenticated workspace that inspects, documents, and fixes Power BI semantic models and reports — a best-practice analyzer with one-click and batch fixes, a report explorer with PBIR diffs, AI-assisted metadata cleanup, and a free IBCS visual, all powered server-side by Fabric User Data Functions
  - path: templates/slide-deck
    name: Slide Deck
    description: Interactive slide deck presenter with sessions, live slide tracking, and audience chat
  - path: templates/static-blankapp
    name: Blank App
    description: Bare-bones Rayfin app with authentication, but without any JS or CSS framework and a tiny TypeScript entry point
  - path: templates/todo-local-experimental
    name: '[Experimental] Todo app with full local dev'
    description: End-to-end todo CRUD with username/password auth, a Rayfin data model, and Docker local development — a working starter that exercises the full data path without Fabric
  - path: templates/universal-app
    name: Universal App
    description: A lean React + Vite starter that grows into anything. A built-in capability router reads what you ask for, then enables the right Rayfin services, installs the right modules, and activates the right skills, from sign-in and CRUD data models to Graphein charts and Fabric analytics dashboards.
