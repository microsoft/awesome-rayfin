version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/scripts"
      - "/templates/*"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      rayfin:
        patterns:
          - "@microsoft/rayfin-*"
      runtime-security:
        applies-to: security-updates
        patterns:
          - "protobufjs"
          - "react-router"
          - "form-data"
          - "ws"
          - "socket.io-parser"
          - "hono"
      parser-utility-security:
        applies-to: security-updates
        patterns:
          - "js-yaml"
          - "brace-expansion"
          - "nanoid"
          - "tmp"
          - "image-size"
      build-security:
        applies-to: security-updates
        patterns:
          - "postcss"
          - "tar"
          - "esbuild"
          - "uuid"
      test-browser-security:
        applies-to: security-updates
        patterns:
          - "vitest"
          - "@vitest/mocker"
          - "browserslist"
          - "baseline-browser-mapping"
      remaining-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 7
